name: Bootstrap repository

on:
  push:
    paths:
      - ".bootstrap-ready"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Restore project tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* > /tmp/project.b64
          base64 --decode /tmp/project.b64 > /tmp/project.tar.gz
          echo "70c0d4f8873eb2437aac038ab86b2c7efcdba357df43c6c7a00b8274719d4469  /tmp/project.tar.gz" | sha256sum --check -
          rm -rf .bootstrap .bootstrap-ready
          tar -xzf /tmp/project.tar.gz
          rm -f .github/workflows/bootstrap.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Energy Security Monitor 0.1.0"
          git push
