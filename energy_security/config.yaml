name: Energy Security Monitor
description: National energy-security assessment with local scoring, source fallbacks, and diagnostics
version: "0.1.0"
slug: energy_security
url: https://github.com/ArrowSK/ha-energy-security
image: ghcr.io/arrowsk/ha-energy-security
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
stage: experimental
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:shield-home
panel_title: Energy Security
panel_admin: true
watchdog: http://[HOST]:[PORT:8099]/healthz
backup: hot
options:
  country: auto
  refresh_minutes: 30
  enable_ha_entities: true
  enable_weather: true
  agsi_key: ""
  entsoe_token: ""
schema:
  country: str
  refresh_minutes: int(10,180)
  enable_ha_entities: bool
  enable_weather: bool
  agsi_key: password
  entsoe_token: password
