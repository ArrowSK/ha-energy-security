name: Energy Security Monitor
description: National energy-security assessment with local scoring, source fallbacks, and diagnostics
version: "0.1.1"
slug: energy_security
url: https://github.com/ArrowSK/ha-energy-security
arch:
  - aarch64
  - amd64
init: false
stage: experimental
homeassistant_api: true
ingress: true
panel_icon: mdi:shield-home
panel_title: Energy Security
options:
  country: auto
  refresh_minutes: 30
  enable_ha_entities: true
  enable_weather: true
  agsi_key: ""
  entsoe_token: ""
schema:
  country: str
  refresh_minutes: int(10,180)
  enable_ha_entities: bool
  enable_weather: bool
  agsi_key: password
  entsoe_token: password
